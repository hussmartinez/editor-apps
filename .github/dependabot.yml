version: 2

# One pull request per package (docs/adr/0004). Development tools are
# grouped, since they don't ship; everything that ships to users, such as an
# SDK, ui, sdk-core or React, gets its own pull request and a review.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      development-tools:
        dependency-type: development
    ignore:
      # @types/node describes the Node major in .node-version (24). Move
      # both together, by hand, rather than take types for a Node the
      # apps don't run on.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
